[project]
name = "dsp-project"
version = "0.1.0"
description = "Two-signal DSP transmission project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
